    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Audio-Trainer</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            padding: 15px; 
            margin: 0;
            min-height: 100vh;
            align-items: flex-start;
        }
        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); 
            width: 100%;       
            max-width: 450px;  
            text-align: center; 
            box-sizing: border-box;
            margin-top: 20px;
        }
        h2 { color: #333; margin-top: 0; }
        p { color: #666; margin-bottom: 5px; }
        
        select, button, input[type="range"] { 
            margin: 15px 0; 
            width: 100%; 
            font-size: 18px; 
        }
        select, button { 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid #ddd; 
            background-color: white;
            display: block;
        }
        button { 
            background: #4a90e2; 
            color: white; 
            cursor: pointer; 
            border: none; 
            transition: 0.3s; 
            font-weight: bold; 
            touch-action: manipulation;
        }
        button:active { background: #357abd; transform: scale(0.98); }
        .secondary-btn { background: #6c757d; margin-top: 10px; }
        .hidden { display: none; }
        
        .answer-item { 
            text-align: left; 
            background: #f8f9fa; 
            padding: 15px; 
            margin-bottom: 12px; 
            border-left: 6px solid #4a90e2; 
            border-radius: 8px; 
            font-size: 16px;
        }
        .status { color: #888; margin-top: 15px; font-weight: bold; font-size: 18px; }
        .speed-label { display: flex; justify-content: space-between; font-size: 14px; color: #555; }
        input[type=range] { height: 30px; }
    </style>
</head>
<body>

<div class="card" id="setup-screen">
    <h2>Einstellungen</h2>
    
    <p>Anzahl der Aufnahmen:</p>
    <select id="file-count">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="5">5</option>
        <option value="8" selected>8</option>
        <option value="10">10</option>
        <option value="20">20</option>
    </select>

    <p>Wiedergabegeschwindigkeit:</p>
    <input type="range" id="speed-range" min="0.5" max="1.5" step="0.1" value="1.0" oninput="updateSpeedLabel(this.value)">
    <div class="speed-label">
        <span>0.5x</span>
        <span id="speed-value"><strong>1.0x</strong></span>
        <span>1.5x</span>
    </div>

    <button onclick="initNewTest()" style="margin-top: 25px;">START</button>
</div>

<div class="card hidden" id="play-screen">
    <h2 id="play-title">Zuhören...</h2>
    <div style="font-size: 70px; margin: 30px;">🔊</div>
    <div class="status" id="status-text">Aufnahme 1</div>
    <p id="current-speed-display" style="font-size: 14px; color: #aaa;"></p>
</div>

<div class="card hidden" id="result-screen">
    <h2>Antworten</h2>
    <div id="answers-container" style="max-height: 50vh; overflow-y: auto; margin-bottom: 20px;"></div>
    <button onclick="restartSameTest()">Wiederholen</button>
    <button class="secondary-btn" onclick="location.reload()">Neuer Test</button>
</div>

    let currentTrackIndex = 0;
    let selectedTracks = [];
    let playbackSpeed = 1.0;
    const audio = new Audio();

    function updateSpeedLabel(val) {
        document.getElementById('speed-value').innerHTML = `<strong>${val}x</strong>`;
        playbackSpeed = parseFloat(val);
    }

    // Тщательное перемешивание массива (Алгоритм Фишера-Йетса)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initNewTest() {
        const count = parseInt(document.getElementById('file-count').value);
        
        // Создаем копию библиотеки, чтобы не портить оригинал
        let deck = [...fullLibrary];
        
        // Перемешиваем и выбираем нужное количество (повторы невозможны)
        selectedTracks = shuffleArray(deck).slice(0, count);
        
        startPlayback();
    }

    function restartSameTest() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('answers-container').innerHTML = "";
        startPlayback();
    }

    function startPlayback() {
        currentTrackIndex = 0;
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('play-screen').classList.remove('hidden');
        document.getElementById('current-speed-display').innerText = `Скорость: ${playbackSpeed}x`;
        playTrack();
    }

    function playTrack() {
        if (currentTrackIndex < selectedTracks.length) {
            document.getElementById('status-text').innerText = `Запись ${currentTrackIndex + 1} из ${selectedTracks.length}`;
            audio.src = selectedTracks[currentTrackIndex].file;
            audio.playbackRate = playbackSpeed;
            
            audio.play();
            // Повторная установка для мобильных браузеров
            audio.onplay = () => { audio.playbackRate = playbackSpeed; };

            audio.onended = () => {
                currentTrackIndex++;
                setTimeout(playTrack, 1200 / playbackSpeed);
            };
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('play-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        const container = document.getElementById('answers-container');
        container.innerHTML = ""; // Очистка перед заполнением
        
        selectedTracks.forEach((track, index) => {
            const div = document.createElement('div');
            div.className = 'answer-item';
            div.innerHTML = `<strong>#${index + 1}</strong><br>👤 ${track.name}<br>📞 ${track.phone}`;
            container.appendChild(div);
        });
    }
